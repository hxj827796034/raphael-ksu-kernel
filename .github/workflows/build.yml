name: Build KSU Kernel (raphael)

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KSU branch/tag (SukiSU main by default)'
        required: false
        default: 'main'
      kernel_branch:
        description: 'Kernel branch (MiCode raphael by default)'
        required: false
        default: 'raphael'
      enable_susfs:
        description: 'Enable SUSFS'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  push:
    branches:
      - main

env:
  KSU_REPO: "https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
  KERNEL_REPO: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
  DEFCONFIG: "raphael_user_defconfig"
  ZIPNAME_BASE: "KSU-raphael-AnyKernel3"
  # Free runners: 14 GB disk, 4 vCPU, 7 GB RAM
  # Use the same disk carefully; clean ccache/out at end.

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison cpio curl flex git \
            libelf-dev libssl-dev rsync unzip wget xz-utils \
            zip ca-certificates python3 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-none-eabi binutils-arm-none-eabi
          echo "deps ok"
          aarch64-linux-gnu-gcc --version
          arm-none-eabi-gcc --version

      - name: Install ccache
        run: |
          sudo apt-get install -y ccache
          echo "ccache ok"
          ccache --version

      - name: Cache kernel source
        uses: actions/cache@v4
        with:
          path: raphael
          # v3 with unique key: no restore-keys to avoid pulling old built-in.o
          # referencing the (now disabled) btfm_slim driver.
          key: kernel-v3-${{ inputs.kernel_branch || 'raphael' }}-${{ github.run_id }}
          # No restore-keys: every build gets a fresh source tree.

      - name: Cache KSU source
        uses: actions/cache@v4
        with:
          path: KernelSU
          key: ksu-${{ inputs.ksu_branch || 'main' }}
          restore-keys: |
            ksu-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}-${{ inputs.kernel_branch || 'raphael' }}
          restore-keys: |
            ccache-

      - name: Clone kernel source
        run: |
          BRANCH="${{ inputs.kernel_branch || 'raphael-p-oss' }}"
          echo "Using kernel branch: $BRANCH"
          if [ ! -d raphael/.git ]; then
            git clone --depth=1 -b "$BRANCH" "$KERNEL_REPO" raphael || {
              echo "branch $BRANCH not found, trying fallback list..."
              for b in raphael-p-oss raphael-q-oss raphael-r-oss raphael-oss raphael; do
                echo "trying $b..."
                git clone --depth=1 -b "$b" "$KERNEL_REPO" raphael && break
              done
            }
          fi
          cd raphael
          git log -1 --oneline
          ls arch/arm64/configs/ | grep -i raphael || { echo "no raphael defconfig found"; exit 1; }

      - name: Clone KSU source
        run: |
          if [ ! -d KernelSU/.git ]; then
            git clone --depth=1 -b "${{ inputs.ksu_branch || 'main' }}" \
              "$KSU_REPO" KernelSU
          fi
          cd KernelSU
          git log -1 --oneline
          ls kernel/ | head -20

      - name: Apply KSU + defconfig merge
        working-directory: raphael
        run: |
          set -e
          # Inject KSU source
          rm -rf ./KernelSU
          cp -a ../KernelSU ./KernelSU
          # Integrate KSU into the build system (SukiSU setup.sh equivalent)
          echo "[+] Setting up KSU symlink and Makefile entries..."
          rm -rf drivers/kernelsu
          ln -s "$(realpath --relative-to=drivers ./KernelSU/kernel)" drivers/kernelsu
          echo "[+] Symlink: drivers/kernelsu -> $(readlink drivers/kernelsu)"
          if ! grep -q "kernelsu" drivers/Makefile; then
            printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
            echo "[+] drivers/Makefile updated"
          fi
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            echo "[+] drivers/Kconfig updated"
          fi
          # Merge defconfig fragment (idempotent)
          DC="arch/arm64/configs/${DEFCONFIG}"
          test -f "$DC" || { echo "missing $DC"; exit 1; }
          MERGE="../defconfig/raphael_ksu_defconfig"
          test -f "$MERGE" || { echo "missing $MERGE"; exit 1; }
          {
            echo ""
            echo "# --- KSU CI merge $(date -u +%FT%TZ) ---"
            cat "$MERGE"
          } >> "$DC.tmp"
          awk -F'=' '
            !($1 in seen) { print; seen[$1]=1 }
          ' "$DC" "$DC.tmp" > "$DC.new" || cp "$DC.tmp" "$DC.new"
          mv "$DC.new" "$DC"
          rm -f "$DC.tmp"
          echo "--- defconfig KSU lines ---"
          grep -E '^CONFIG_KSU|^CONFIG_SUSFS' "$DC" || true

      - name: Patch SELinux classmap for newer glibc
        working-directory: raphael
        run: |
          # Newer glibc (2.35+, Ubuntu 22.04) has PF_MAX > 44
          # 4.14 kernel's classmap.h has a hardcoded check that fails.
          # Patch: relax the limit (or comment out) so build proceeds.
          F="security/selinux/include/classmap.h"
          if [ -f "$F" ]; then
            if grep -q "PF_MAX > 44" "$F"; then
              sed -i 's|#if PF_MAX > 44|#if PF_MAX > 60|' "$F"
              echo "[+] Patched $F: PF_MAX threshold 44 -> 60"
            fi
          fi
          F="security/selinux/include/secclass_map.h"
          if [ -f "$F" ] && [ ! -s "$F" ]; then
            # This is auto-generated; sometimes empty if genheaders failed
            echo "[-] $F is empty (expected, will be regenerated)"
          fi

      - name: Disable Qualcomm proprietary Bluetooth drivers
        working-directory: raphael
        run: |
          # BTFM_SLIM and friends have broken include paths in the OSS source
          # (#include <btfm_slim.h> with no -I). Disable via defconfig instead
          # of trying to fix every include path.
          # This step is now a no-op - the defconfig fragment handles it.
          echo "BTFM_SLIM disabled via defconfig fragment"

      - name: Fix trace header include paths
        working-directory: raphael
        run: |
          set -e
          # Many Qualcomm/backported trace headers set 'TRACE_INCLUDE_PATH .'. The
          # 4.14 in-tree build does not add -I$(src), so define_trace.h resolves
          # '.' relative to include/trace/ and the self re-include fails with
          # "./xxx_trace.h: No such file or directory". Point each header at its
          # real directory, expressed relative to include/trace/.
          files=$(grep -rlE '^#define TRACE_INCLUDE_PATH[[:space:]]*\.[[:space:]]*$' \
            drivers fs net sound security arch/arm64 2>/dev/null || true)
          if [ -n "$files" ]; then
            for f in $files; do
              d=$(dirname "$f")
              rel=$(realpath -m --relative-to=include/trace "$d")
              sed -i "s|^#define TRACE_INCLUDE_PATH[[:space:]]*\.[[:space:]]*$|#define TRACE_INCLUDE_PATH $rel|" "$f"
              echo "[+] $f -> $rel"
            done
          else
            echo "[-] no trace headers need fixing"
          fi

      - name: Patch Qualcomm driver source issues
        working-directory: raphael
        run: |
          set -e
          # kgsl_events.c includes a local header with angle brackets, which the
          # in-tree 4.14 build cannot resolve (no -I$(src)). Use quotes like the
          # rest of the kgsl driver does.
          F="drivers/gpu/msm/kgsl_events.c"
          if [ -f "$F" ]; then
            sed -i 's|#include <kgsl_device.h>|#include "kgsl_device.h"|' "$F"
            echo "[+] fixed $F include"
          fi
          # sde_hw_catalog.h has a missing return type (implicit int), which the
          # kernel's -Werror=implicit-int turns into an error. Restore 'bool'.
          F="drivers/gpu/drm/msm/sde/sde_hw_catalog.h"
          if [ -f "$F" ]; then
            sed -i 's|static inline sde_hw_intf_te_supported(const struct sde_mdss_cfg|static inline bool sde_hw_intf_te_supported(const struct sde_mdss_cfg|' "$F"
            echo "[+] fixed $F implicit int"
          fi
          # The camera framework (SPECTRA_CAMERA) OSS dump has broken include
          # paths: headers reference each other by basename across subdirs, but
          # the per-subdir Makefiles only list a few -I dirs. Add every camera
          # subdirectory to the include path for the whole camera build.
          CAM="drivers/media/platform/msm/camera"
          if [ -f "$CAM/Makefile" ]; then
            echo "" >> "$CAM/Makefile"
            echo "# CI: add all camera subdirs to include path" >> "$CAM/Makefile"
            find "$CAM" -type d | sort | while read -r d; do
              echo "subdir-ccflags-y += -I$d" >> "$CAM/Makefile"
            done
            echo "[+] patched $CAM/Makefile include paths"
          fi
          # GCC 11's __builtin_object_size is more aggressive than the GCC the
          # 4.14 kernel expected; it makes check_copy_size()'s compile-time
          # __bad_copy_to/__bad_copy_from fire on Qualcomm GSI/IPA drivers. Keep
          # the runtime check but neutralize the compile-time one.
          F="include/linux/thread_info.h"
          if [ -f "$F" ]; then
            sed -i 's|int sz = __compiletime_object_size(addr);|int sz = -1; /* GCC11 fortify false positives */|' "$F"
            echo "[+] neutralized compiletime object-size check in $F"
          fi
          # Qualcomm USB gadget backport uses <function/u_ncm.h> with angle
          # brackets; the in-tree 4.14 build has no -I for the gadget dir, so
          # fix the include and add the gadget dir to the include path.
          F="drivers/usb/gadget/configfs.c"
          if [ -f "$F" ]; then
            sed -i 's|#include <function/u_ncm.h>|#include "function/u_ncm.h"|' "$F"
            echo "[+] fixed $F include"
          fi
          F="drivers/usb/gadget/Makefile"
          if [ -f "$F" ]; then
            printf '%s\n' 'ccflags-y += -I$(srctree)/drivers/usb/gadget' >> "$F"
            echo "[+] added gadget include path"
          fi

      - name: Setup Linaro GCC 9.2 toolchain
        run: |
          set -e
          TC="$HOME/toolchains"
          GCCDIR="$TC/gcc-linaro-9.2.1-2019.12-x86_64_aarch64-linux-gnu"
          mkdir -p "$TC"
          if [ ! -d "$GCCDIR" ]; then
            wget -q -O "$TC/gcc.tar.xz" \
              https://releases.linaro.org/components/toolchain/binaries/9.2-2019.12/aarch64-linux-gnu/gcc-linaro-9.2.1-2019.12-x86_64_aarch64-linux-gnu.tar.xz
            tar -xf "$TC/gcc.tar.xz" -C "$TC"
            rm -f "$TC/gcc.tar.xz"
          fi
          "$GCCDIR/bin/aarch64-linux-gnu-gcc" --version
          echo "GCC92_BIN=$GCCDIR/bin" >> $GITHUB_ENV

      - name: Build kernel
        working-directory: raphael
        env:
          # Linaro GCC 9.2 (era-appropriate for 4.14; avoids GCC 10+/11
          # warnings-as-errors on Qualcomm code).
          CC: aarch64-linux-gnu-gcc
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-none-eabi-
          KCFLAGS: -fcommon -Wno-designated-init -Wno-error=implicit-int -std=gnu11
          HOSTCFLAGS: -fcommon
          HOSTLDFLAGS: -fcommon
        run: |
          set -eo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          make clean 2>/dev/null || true
          make "$DEFCONFIG"
          export PATH="$GCC92_BIN:$PATH"
          make -j"$(nproc)" \
            CC="$CC" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            KCFLAGS="$KCFLAGS" \
            HOSTCFLAGS="$HOSTCFLAGS" \
            HOSTLDFLAGS="$HOSTLDFLAGS" \
            2>&1 | tee ../build.log
          # Verify Image was produced
          ls -la arch/arm64/boot/Image*

      - name: Verify Image
        working-directory: raphael
        run: |
          ls -la arch/arm64/boot/Image* 2>/dev/null || { echo "no Image produced"; exit 1; }

      - name: Package AnyKernel3 zip
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          TS=$(date +%Y%m%d-%H%M)
          ZIP="${ZIPNAME_BASE}-${TS}.zip"
          WORK="out/pack"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp -a anykernel3-raphael/. "$WORK"/
          # Fetch real ak3-core.sh
          if [ ! -s "$WORK/tools/ak3-core.sh" ]; then
            curl -L --fail -o "$WORK/tools/ak3-core.sh" \
              https://raw.githubusercontent.com/osm0sis/AnyKernel3/master/tools/ak3-core.sh
            chmod 0755 "$WORK/tools/ak3-core.sh"
          fi
          # Choose best Image
          if [ -f raphael/arch/arm64/boot/Image.gz-dtb ]; then
            cp raphael/arch/arm64/boot/Image.gz-dtb "$WORK/Image.gz"
          elif [ -f raphael/arch/arm64/boot/Image.gz ]; then
            cp raphael/arch/arm64/boot/Image.gz "$WORK/"
          elif [ -f raphael/arch/arm64/boot/Image ]; then
            gzip -9 -c raphael/arch/arm64/boot/Image > "$WORK/Image.gz"
          else
            echo "no image"; exit 1
          fi
          # Update module.prop
          sed -i "s|^version=.*|version=${TS}|" "$WORK/module.prop"
          sed -i "s|^date=.*|date=$(date +%Y-%m-%d)|" "$WORK/module.prop"
          # Sanity
          file "$WORK/Image.gz" | grep -qi gzip || { echo "Image.gz invalid"; exit 1; }
          ( cd "$WORK" && zip -r9 "../../$ZIP" . -x "*.bak" )
          ls -la "$ZIP"
          echo "ARTIFACT_PATH=$ZIP" >> $GITHUB_ENV
          echo "ARTIFACT_SIZE=$(du -h "$ZIP" | awk '{print $1}')" >> $GITHUB_ENV

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSU-raphael-zip
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "### Build result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: \`${{ env.ARTIFACT_PATH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Size: ${{ env.ARTIFACT_SIZE }}" >> $GITHUB_STEP_SUMMARY
          echo "- Kernel: ${{ inputs.kernel_branch || 'raphael' }} + KSU ${{ inputs.ksu_branch || 'main' }}" >> $GITHUB_STEP_SUMMARY
